openapi: 3.0.0
info:
  description: API for monitoring and controlling the MoMail FTN mailer.
  title: MoMail API
  version: 0.1.0
servers:
- description: Local development server
  url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /api/status:
    get:
      description: "Returns a real-time snapshot of the mailer's status, including\
        \ active sessions and uptime."
      operationId: getStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStatus"
          description: Successful response with application status.
      summary: Get Application Status
  /api/control:
    post:
      description: "Executes a control command on the mailer, such as forcing a scan\
        \ or queuing a poll."
      operationId: sendControlCommand
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResponse"
          description: Command executed successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Bad Request (e.g., missing parameters, unknown action)."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Internal Server Error (e.g., failed to create a file)."
      summary: Send Control Command
  /api/queue:
    get:
      description: Returns the current BSO outbound queue with status details.
      operationId: getQueue
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/QueueEntry"
                type: array
          description: Successful response.
      summary: Get Outbound Queue
  /api/queue/{address}:
    delete:
      description: Deletes the poll (flow files) for the specified node.
      operationId: deletePoll
      parameters:
      - description: FidoNet address (e.g. 2:5083/85.1)
        explode: false
        in: path
        name: address
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResponse"
          description: Poll deleted successfully.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Poll not found.
      summary: Delete Poll
    patch:
      description: Updates the flavor or suspension status of a node.
      operationId: updateNode
      parameters:
      - description: FidoNet address (e.g. 2:5083/85.1)
        explode: false
        in: path
        name: address
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResponse"
          description: Node updated successfully.
      summary: Update Node Status
  /api/nodelist/{address}:
    get:
      description: Retrieves information for a specific node from the loaded nodelist.
      operationId: getNodeInfo
      parameters:
      - description: FidoNet address (e.g. 2:5083/85.1)
        explode: false
        in: path
        name: address
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeInfo"
          description: Successful response with node details.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Node not found in nodelist.
      summary: Get Nodelist Information
components:
  schemas:
    QueueEntry:
      example:
        flavor: Crash
        echomail_size: 2
        address: 2:5083/85.1
        files: 5
        is_suspended: true
        netmail_size: 5
        is_busy: true
      properties:
        address:
          example: 2:5083/85.1
          type: string
        flavor:
          description: The flavor of the mail in queue (priority).
          enum:
          - Crash
          - Direct
          - Hold
          - Normal
          type: string
        files:
          description: Number of mail files in the queue.
          type: integer
        netmail_size:
          description: Total size of netmail bundles in bytes.
          format: int64
          type: integer
        echomail_size:
          description: Total size of echomail bundles in bytes.
          format: int64
          type: integer
        is_suspended:
          description: Whether the node is suspended (on hold).
          type: boolean
        is_busy:
          description: Whether the node is currently busy/locked.
          type: boolean
      type: object
    NodeUpdate:
      example:
        flavor: Crash
        suspended: true
      properties:
        flavor:
          enum:
          - Crash
          - Direct
          - Hold
          - Normal
          type: string
        suspended:
          type: boolean
      type: object
    NodeInfo:
      example:
        address: address
        sysop: sysop
        phone: phone
        flags:
        - flags
        - flags
        dns: dns
        dns_root: dns_root
        location: location
      properties:
        address:
          type: string
        sysop:
          type: string
        location:
          type: string
        flags:
          items:
            type: string
          type: array
        phone:
          type: string
        dns:
          description: The resolved DNS address for the node.
          type: string
        dns_root:
          description: The DNS root that was queried.
          type: string
      type: object
    SessionInfo:
      example:
        current_file: file.pkt
        started_at: 2000-01-23T04:56:07.000+00:00
        id: 127.0.0.1:54321
        state: Receiving
        remote: 127.0.0.1:54321
        file_pos: 0
        file_size: 6
        direction: IN
      properties:
        id:
          example: 127.0.0.1:54321
          type: string
        remote:
          example: 127.0.0.1:54321
          type: string
        direction:
          enum:
          - IN
          - OUT
          type: string
        state:
          example: Receiving
          type: string
        current_file:
          example: file.pkt
          type: string
        file_pos:
          format: int64
          type: integer
        file_size:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
      type: object
    AppStatus:
      example:
        outbound_queue:
        - flavor: Crash
          echomail_size: 2
          address: 2:5083/85.1
          files: 5
          is_suspended: true
          netmail_size: 5
          is_busy: true
        - flavor: Crash
          echomail_size: 2
          address: 2:5083/85.1
          files: 5
          is_suspended: true
          netmail_size: 5
          is_busy: true
        sessions:
          key:
            current_file: file.pkt
            started_at: 2000-01-23T04:56:07.000+00:00
            id: 127.0.0.1:54321
            state: Receiving
            remote: 127.0.0.1:54321
            file_pos: 0
            file_size: 6
            direction: IN
        address: 2:5020/828.0
        version: "0.1"
        muted: true
        next_scan_in: 1
        uptime: 1h2m3s
      properties:
        address:
          example: 2:5020/828.0
          type: string
        version:
          example: "0.1"
          type: string
        uptime:
          example: 1h2m3s
          type: string
        sessions:
          additionalProperties:
            $ref: "#/components/schemas/SessionInfo"
          type: object
        next_scan_in:
          description: Seconds until next scan
          type: integer
        muted:
          type: boolean
        outbound_queue:
          items:
            $ref: "#/components/schemas/QueueEntry"
          type: array
      type: object
    ControlRequest:
      example:
        flavor: normal
        address: 2:5083/85.1
        action: force_scan
        command: echo 'Hourly check-in from momail scheduler'
      properties:
        action:
          description: The control action to perform.
          enum:
          - force_scan
          - queue_poll
          - run_task
          - mute
          - unmute
          - reload_config
          type: string
        address:
          description: The FidoNet address for 'queue_poll' action.
          example: 2:5083/85.1
          type: string
        flavor:
          default: normal
          description: "The flavor of poll file to create. Can be 'crash', 'direct',\
            \ 'hold', or 'normal'."
          type: string
        command:
          description: "The exact command string for 'run_task' action, as defined\
            \ in config."
          example: echo 'Hourly check-in from momail scheduler'
          type: string
      required:
      - action
      type: object
    ControlResponse:
      example:
        message: Outbound scan triggered
        status: ok
      properties:
        status:
          example: ok
          type: string
        message:
          example: Outbound scan triggered
          type: string
      type: object
    ErrorResponse:
      example:
        message: "unknown action: invalid_action"
        status: error
      properties:
        status:
          example: error
          type: string
        message:
          example: "unknown action: invalid_action"
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
