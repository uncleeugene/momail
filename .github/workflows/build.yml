name: Build and Release

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  push:
    tags: [ "v*" ]

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build and Package
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        PKG_NAME="momail-${{ matrix.os }}-${{ matrix.arch }}"
        mkdir -p "$PKG_NAME"
        go build -v -trimpath -ldflags="-s -w" -o "$PKG_NAME/momail${{ matrix.ext }}" .
        cp config.yaml.dist momail.service README.md analyze_logs.py "$PKG_NAME/"
        zip -r "dist/$PKG_NAME.zip" "$PKG_NAME"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: momail-${{ matrix.os }}-${{ matrix.arch }}
        path: dist/momail-${{ matrix.os }}-${{ matrix.arch }}.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    # This job should only run when a tag is pushed.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # Required to create a release.

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: "artifacts/*/*.zip"
          generate_release_notes: true